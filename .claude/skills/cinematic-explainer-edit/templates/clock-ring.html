<!-- Alarm clock with gradient progress ring; big number + unit. Edit: CFG.hours, KICKER, UNIT. -->
<template>
  <style>
#root { position: absolute; inset: 0; overflow: hidden; background:
      radial-gradient(ellipse 60% 55% at 50% 48%, rgba(38,62,170,.42), transparent 70%),
      radial-gradient(ellipse 40% 40% at 78% 28%, rgba(126,52,180,.22), transparent 70%), #05060d; }
    .kick { font-family: "Inter", sans-serif; font-weight: 700; font-size: 28px; letter-spacing: .32em; color: #9fb0d8; text-transform: uppercase; }
    .hero { font-family: "Montserrat", sans-serif; font-weight: 900; color: #fff; line-height: .92; letter-spacing: -.02em; }
    .gt { background: linear-gradient(90deg, #c86bff, #6f7bff 55%, #4fa3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { font-family: "Inter", sans-serif; font-weight: 500; font-size: 30px; color: #b8c2dd; }
    .floor { position: absolute; left: 0; right: 0; top: 820px; height: 260px; background: linear-gradient(rgba(255,255,255,.035), transparent); }
    .face { position: absolute; left: 470px; top: 290px; width: 400px; height: 400px; border-radius: 50%;
            background: radial-gradient(circle, #fbfbfe 0 62%, #c9ced9 68%, #f3f5fa 72%, #6e7689 77%, #262a35 80%, transparent 81%); box-shadow: 0 40px 80px rgba(0,0,0,.6); }
    .bell { position: absolute; top: 250px; width: 110px; height: 70px; border-radius: 110px 110px 0 0; background: linear-gradient(#f4f6fb, #8d95a9); }
    .hand { position: absolute; left: 668px; background: #161a22; border-radius: 3px; transform-origin: 50% 100%; }
    .num { position: absolute; font: 700 26px "Inter", sans-serif; color: #232733; transform: translate(-50%, -50%); }
  </style>
  <div id="root" data-composition-id="clock-ring" data-width="1920" data-height="1080">
    <div class="floor"></div>
    <div id="ck-obj">
      <svg style="position:absolute; left: 370px; top: 190px;" width="600" height="600" viewBox="0 0 600 600">
        <defs><linearGradient id="ck-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c86bff"/><stop offset=".55" stop-color="#6f7bff"/><stop offset="1" stop-color="#4fa3ff"/></linearGradient></defs>
        <circle cx="300" cy="300" r="270" fill="none" stroke="rgba(160,175,220,.12)" stroke-width="16"/>
        <circle id="ck-ring" cx="300" cy="300" r="270" fill="none" stroke="url(#ck-g)" stroke-width="16" stroke-linecap="round"
                stroke-dasharray="1696.5" stroke-dashoffset="1696.5" transform="rotate(-90 300 300)"/>
      </svg>
      <div class="bell" style="left: 470px; transform: rotate(-28deg);"></div>
      <div class="bell" style="left: 760px; transform: rotate(28deg);"></div>
      <div class="face"></div>
      <div id="ck-nums"></div>
      <div id="ck-h" class="hand" data-layout-allow-occlusion style="top: 390px; width: 8px; height: 100px; margin-left: -1px;"></div>
      <div id="ck-m" class="hand" data-layout-allow-occlusion style="top: 340px; width: 5px; height: 150px; margin-left: 1px;"></div>
      <div style="position:absolute; left: 658px; top: 478px; width: 24px; height: 24px; border-radius: 50%; background: #161a22;"></div>
    </div>
    <div style="position:absolute; left: 1100px; top: 330px;">
      <div id="ck-k" class="kick">AWAKE</div>
      <div id="ck-v" class="hero gt" style="font-size: 230px; margin-top: 6px;">0</div>
      <div id="ck-u" class="hero" style="font-size: 110px;">HOURS</div>
    </div>
  </div>
  <script>
    const CFG = { hours: 18, of: 24 };
    const tl = gsap.timeline({ paused: true });
    const ns = document.querySelector("#ck-nums");
    for (let h = 1; h <= 12; h++) { const a = (h * 30 - 90) * Math.PI / 180; ns.insertAdjacentHTML("beforeend", '<div class="num" style="left:' + (670 + 140 * Math.cos(a)) + 'px;top:' + (490 + 140 * Math.sin(a)) + 'px">' + h + '</div>'); }
    const v = document.querySelector("#ck-v"), c = { v: 0 };
    tl.fromTo("#ck-obj", { opacity: 0, scale: 0.92, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0);
    tl.fromTo("#ck-ring", { attr: { "stroke-dashoffset": 1696.5 } }, { attr: { "stroke-dashoffset": 1696.5 * (1 - CFG.hours / CFG.of) }, duration: 1.4, ease: "power3.out" }, 0.3);
    tl.fromTo("#ck-m", { rotation: 0 }, { rotation: 360 * 3, duration: 1.4, ease: "power3.out" }, 0.3);
    tl.fromTo("#ck-h", { rotation: 0 }, { rotation: 360 * CFG.hours / 12, duration: 1.4, ease: "power3.out" }, 0.3);
    tl.fromTo("#ck-k", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.15);
    tl.fromTo("#ck-u", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.35);
    tl.fromTo(c, { v: 0 }, { v: CFG.hours, duration: 1.4, ease: "power3.out", onUpdate: () => { v.textContent = Math.round(c.v); } }, 0.3);
    window.__timelines["clock-ring"] = tl;
  </script>
</template>
